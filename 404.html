<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2A2750">
<title>Page not found — Ahmed Zarif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@800;900&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* The same world as the home page: deep indigo, one spectrum, nothing else. */
:root{
  --bg:#3E3B6B;--bg-3:#2A2750;
  --on-dark:#EDEBFA;--on-dark-2:#B6B1D8;
  --g1:#7C4DFF;--g2:#E040FB;--g3:#FF5C8A;--g4:#FFC46B;--g5:#5BE3A8;
  --spectrum:linear-gradient(115deg,var(--g5) 0%,var(--g4) 22%,var(--g3) 48%,var(--g2) 74%,var(--g1) 100%);
  --hot:linear-gradient(92deg,var(--g1) 0%,var(--g2) 45%,var(--g3) 100%);
  --disp:"Chivo","Instrument Sans",-apple-system,"Segoe UI",sans-serif;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  display:grid;place-items:center;padding:2rem 1.25rem;
  background:radial-gradient(60rem 40rem at 20% 0%,rgba(124,77,255,.35),transparent 60%),
             radial-gradient(50rem 36rem at 90% 100%,rgba(91,227,168,.18),transparent 60%),
             linear-gradient(180deg,var(--bg) 0%,var(--bg-3) 100%);
  color:var(--on-dark);font-family:var(--sans);font-size:1.05rem;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
main{max-width:34rem;text-align:center}
.code{
  font-family:var(--mono);font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--on-dark-2);margin-bottom:1.25rem
}
h1{
  font-family:var(--disp);font-weight:900;font-size:clamp(3.4rem,14vw,6.5rem);line-height:.95;
  letter-spacing:-.02em;margin-bottom:1rem;
  background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent
}
p{color:var(--on-dark-2);margin-bottom:2rem}
.btn{
  display:inline-block;padding:.9rem 1.5rem;border-radius:999px;font-weight:600;
  font-size:.95rem;color:#fff;text-decoration:none;background:var(--hot);
  box-shadow:0 10px 30px rgba(224,64,251,.25);transition:transform .25s,box-shadow .25s
}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(224,64,251,.35)}
.btn:focus-visible{outline:3px solid var(--g5);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="code">404 &middot; not found</p>
  <h1>Lost the thread.</h1>
  <p>That page isn't here &mdash; it may have moved, or the link was a typo.</p>
  <a class="btn" href="/">Back to the portfolio</a>
</main>
</body>
</html>
